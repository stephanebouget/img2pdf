<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Convert images to PDF with ease" />
    <meta name="theme-color" content="#3b82f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="apple-mobile-web-app-title" content="Img2PDF" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./icon.svg" />
    <title>Image to PDF Converter</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/jspdf@latest/dist/jspdf.umd.min.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="header">
        <h1>Convert Images to PDF</h1>
        <button id="install-btn" title="Install as app">
          <svg fill="currentColor" viewBox="0 0 24 24">
            <path
              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"
            />
            <path
              d="M19 3h-7V0h7c2.762 0 5 2.238 5 5v7h-3V5c0-1.105-.895-2-2-2z"
            />
            <path d="M13 13h4v3h-3v4h-1v-4h-3v-3h3v-3h1v3z" />
          </svg>
        </button>
      </div>

      <div class="content">
        <div class="drop-zone" id="drop-zone">
          <svg
            class="drop-zone-icon"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="1.5"
              d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"
            />
          </svg>
          <p class="drop-zone-text">
            Drag & Drop or <a id="browse-link">Choose files</a> to upload
          </p>
          <p class="drop-zone-hint">PNG, JPG, JPEG, WEBP</p>
          <input type="file" id="file-selector" multiple accept="image/*" />
        </div>

        <div class="file-item" id="file-item">
          <div class="file-icon">
            <svg
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              viewBox="0 0 24 24"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"
              />
            </svg>
          </div>
          <div class="file-info">
            <div class="file-name" id="file-count">0 images selected</div>
            <div class="progress-bar">
              <div class="progress-fill" id="progress-fill"></div>
            </div>
          </div>
          <div class="progress-text" id="progress-text">0%</div>
        </div>

        <div class="status-badge" id="status-badge">
          <svg
            width="14"
            height="14"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M5 13l4 4L19 7"
            />
          </svg>
          Ready to download
        </div>

        <div class="preview-section">
          <p class="preview-label">Preview</p>
          <div id="imgs"></div>
        </div>

        <div class="options-section">
          <label class="option-item">
            <input type="checkbox" id="keep-ratio" checked />
            <span class="checkbox-custom">
              <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path
                  stroke-linecap="round"
                  stroke-linejoin="round"
                  stroke-width="3"
                  d="M5 13l4 4L19 7"
                />
              </svg>
            </span>
            <span class="option-label"
              ><strong>Keep aspect ratio</strong> — Image will be centered on A4
              page</span
            >
          </label>
        </div>
      </div>

      <div class="footer">
        <button class="btn btn-secondary" id="reset-btn" onclick="init();">
          Cancel
        </button>
        <button class="btn btn-primary" id="dl-btn" onclick="download();">
          <svg
            width="16"
            height="16"
            fill="none"
            stroke="currentColor"
            viewBox="0 0 24 24"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"
            />
          </svg>
          Download PDF
        </button>
      </div>
    </div>

    <script src="./script.js"></script>
  </body>
</html>
